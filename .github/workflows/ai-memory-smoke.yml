name: Memory APK Native Import Smoke
on:
  push:
    branches: [ai-writing]
    paths: ['.github/workflows/ai-memory-smoke.yml', 'ai/smoke_memory_import.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: memory-native-smoke
  cancel-in-progress: true
jobs:
  native_import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: legado-ai-memory-14
          run-id: 34600624012
          github-token: ${{ github.token }}
          path: tested-build
      - name: Prepare first-launch UI handling
        run: python3 ai/smoke_device_dialogs.py
      - name: Enable emulator virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native UI import and exact-text preservation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 -u ai/smoke_memory_import.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-native-import-${{ github.run_number }}
          path: smoke-results/
          retention-days: 30
