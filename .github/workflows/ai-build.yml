name: Legado AI Build
on:
  push:
    branches: [ai-writing]
    paths:
      - '.github/workflows/ai-build.yml'
      - 'ai/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: legado-ai-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Integrate AI module
        run: python3 ai/install.py
      - name: Verify visible AI entry
        run: |
          set -euo pipefail
          grep -q 'android:id="@id/menu_ai_creation"' app/src/main/res/menu/main_bookshelf.xml
          grep -q 'android:title="AI 创作"' app/src/main/res/menu/main_bookshelf.xml
          grep -q 'app:showAsAction="always|withText"' app/src/main/res/menu/main_bookshelf.xml
          grep -q 'R.id.menu_ai_creation -> io.legado.app.ai.AiActivity.open' app/src/main/java/io/legado/app/ui/main/bookshelf/BaseBookshelfFragment.kt
          grep -q 'android:name=".ai.AiActivity"' app/src/main/AndroidManifest.xml
          echo 'VISIBLE_AI_ENTRY_OK'
      - name: Build native AI APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleAppRelease --stacktrace --console=plain --no-daemon --max-workers=2 2>&1 | tee build-ai.log
      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p ai-artifacts
          cp build-ai.log ai-artifacts/ || true
          cp ai/INTEGRATION_APPLIED.json ai-artifacts/ || true
          cp app/src/main/res/menu/main_bookshelf.xml ai-artifacts/MAIN_BOOKSHELF_WITH_AI.xml || true
          find app/build/outputs/apk -name '*.apk' -exec cp {} ai-artifacts/ \; || true
          git rev-parse HEAD > ai-artifacts/SOURCE_COMMIT.txt
          python3 - <<'PY'
          import os, zipfile
          excluded={'.git','.gradle','build','.kotlin','ai-artifacts','node_modules'}
          with zipfile.ZipFile('ai-artifacts/Source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk('.'):
                  dirs[:]=[d for d in dirs if d not in excluded]
                  for name in files:
                      path=os.path.join(root,name)
                      if name.endswith('.jks'): continue
                      z.write(path, os.path.relpath(path,'.'))
          PY
          tool=$(find "$ANDROID_HOME/build-tools" -name apksigner.jar | sort -V | tail -1)
          [ -z "$tool" ] || cp "$tool" ai-artifacts/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legado-ai-build-${{ github.run_number }}
          path: ai-artifacts/
          retention-days: 30
          if-no-files-found: error
